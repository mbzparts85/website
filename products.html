<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MBZ TRADING - Toyota Genuine Auto Spare Parts</title><link rel="stylesheet" href="style.css"><style>.mbz-main-brand{text-align:center;padding:22px 10px 12px;font-weight:900;font-size:clamp(2.8rem,7vw,5.5rem);line-height:1;letter-spacing:.04em}.mbz-main-brand span{display:block;margin-top:8px;font-size:clamp(.8rem,1.6vw,1.2rem);letter-spacing:.22em;font-weight:700}.products-tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.products-tools input,.products-tools select{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}.products-tools input{flex:1;min-width:260px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.card{border:1px solid #ddd;border-radius:12px;padding:18px;background:#fff}.card h3{margin:0 0 10px}.meta{margin:6px 0;color:#555}.wa{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:7px;text-decoration:none;font-weight:700}.pagination{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:28px 0}.pagination button{padding:9px 13px;border:1px solid #ccc;background:#fff;border-radius:7px;cursor:pointer}.pagination .active{background:#111;color:#fff}.pagination button:disabled{opacity:.45;cursor:not-allowed}.info{text-align:center;color:#666;margin:10px 0}</style></head><body><div class="mbz-main-brand">MBZ TRADING<span>AUTO SPARE PARTS</span></div><main class="container" style="padding-top:20px"><h1>Toyota Genuine Auto Spare Parts</h1><p>10 products per page</p><div class="products-tools"><input id="q" type="search" placeholder="Search part number or description"><select id="cat"><option value="">All Categories</option></select></div><div id="info" class="info"></div><div id="grid" class="grid"></div><div id="pages" class="pagination"></div><div id="pageInfo" class="info"></div></main><script src="script.js"></script><script>
(function(){
const SIZE=10;let pageNo=1,all=[],filtered=[];
function pick(o,keys){for(const k of keys)if(o&&o[k]!=null&&String(o[k]).trim())return o[k];return ""}
function getData(){const c=[window.products,window.parts,window.productData,window.toyotaParts,window.inventory,window.items];for(const x of c)if(Array.isArray(x)&&x.length)return x;for(const k of Object.keys(window)){try{const x=window[k];if(Array.isArray(x)&&x.length&&typeof x[0]==="object"&&/04465|part.?number|description/i.test(JSON.stringify(x.slice(0,3))))return x}catch(e){}}return []}
function norm(o){return{part:pick(o,["partNumber","part_number","Part Number","partNo","part","PART NUMBER"]),desc:pick(o,["description","Description","desc","DESCRIPTION","name"]),category:pick(o,["category","Category","CATEGORY"]),model:pick(o,["model","Model"]),engine:pick(o,["engine","Engine","engineCC","Engine CC"]),fitment:pick(o,["fitment","Fitment","filment","Filment"])}}
function esc(x){return String(x||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function renderCats(){const cs=[...new Set(all.map(x=>x.category).filter(Boolean))].sort();cat.innerHTML='<option value="">All Categories</option>'+cs.map(x=>'<option>'+esc(x)+'</option>').join("")}
function filter(){const qv=q.value.toLowerCase().trim(),cv=cat.value;filtered=all.filter(x=>(!qv||[x.part,x.desc,x.category,x.model,x.engine,x.fitment].join(" ").toLowerCase().includes(qv))&&(!cv||x.category===cv));pageNo=1;render()}
function render(){const total=Math.max(1,Math.ceil(filtered.length/SIZE));if(pageNo>total)pageNo=total;const start=(pageNo-1)*SIZE,items=filtered.slice(start,start+SIZE);info.textContent='Showing '+(filtered.length?start+1:0)+'-'+Math.min(start+SIZE,filtered.length)+' of '+filtered.length+' products';grid.innerHTML=items.length?items.map(x=>'<article class="card"><h3>'+esc(x.part||'Toyota Genuine Part')+'</h3><div class="meta"><b>Description:</b> '+esc(x.desc||'—')+'</div><div class="meta"><b>Category:</b> '+esc(x.category||'—')+'</div>'+(x.model?'<div class="meta"><b>Model:</b> '+esc(x.model)+'</div>':'')+(x.engine?'<div class="meta"><b>Engine:</b> '+esc(x.engine)+'</div>':'')+(x.fitment?'<div class="meta"><b>Fitment:</b> '+esc(x.fitment)+'</div>':'')+'<a class="wa" target="_blank" href="https://wa.me/923335173910?text='+encodeURIComponent('Hello MBZ TRADING, I am interested in Toyota genuine part '+x.part+'. Please provide price and availability.')+'">Enquire on WhatsApp</a></article>').join(""):"<p>No products found.</p>";pages.innerHTML="";const prev=document.createElement('button');prev.textContent='Previous';prev.disabled=pageNo===1;prev.onclick=()=>{pageNo--;render()};pages.appendChild(prev);for(let i=1;i<=total;i++){const b=document.createElement('button');b.textContent=i;b.className=i===pageNo?'active':'';b.onclick=()=>{pageNo=i;render()};pages.appendChild(b)}const next=document.createElement('button');next.textContent='Next';next.disabled=pageNo===total;next.onclick=()=>{pageNo++;render()};pages.appendChild(next);pageInfo.textContent='Page '+pageNo+' of '+total}
all=getData().map(norm).filter(x=>x.part||x.desc);filtered=all.slice();renderCats();render();q.addEventListener('input',filter);cat.addEventListener('change',filter)
})();
</script></body></html>
