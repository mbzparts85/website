<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBZ TRADING - AUTO SPARE PARTS</title>
<link rel="stylesheet" href="style.css">
<style>
* { box-sizing:border-box; }
.mbz-brand {
  text-align:center;
  padding:28px 10px 18px;
}
.mbz-brand .title {
  font-size:clamp(42px,7vw,78px);
  font-weight:900;
  line-height:1;
  letter-spacing:.03em;
}
.mbz-brand .subtitle {
  display:block;
  margin-top:9px;
  font-size:clamp(13px,1.6vw,21px);
  font-weight:700;
  letter-spacing:.22em;
}
.products-page {
  max-width:1200px;
  margin:0 auto;
  padding:20px;
}
.products-tools {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin:22px 0;
}
.products-tools input,
.products-tools select {
  min-height:46px;
  padding:11px 14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
.products-tools input {
  flex:1 1 300px;
}
.products-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}
.product-card {
  border:1px solid #ddd;
  border-radius:10px;
  padding:18px;
  background:#fff;
}
.product-card h3 {
  margin:0 0 10px;
  font-size:20px;
}
.product-meta {
  margin:6px 0;
  color:#555;
}
.whatsapp-btn {
  display:inline-block;
  margin-top:12px;
  padding:10px 15px;
  border-radius:7px;
  text-decoration:none;
  font-weight:700;
}
.page-status {
  text-align:center;
  margin:15px 0;
  color:#666;
}
.pagination {
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin:28px 0 45px;
}
.pagination button {
  min-width:42px;
  min-height:40px;
  padding:8px 12px;
  border:1px solid #ccc;
  border-radius:7px;
  background:#fff;
  cursor:pointer;
  font-weight:600;
}
.pagination button.active {
  background:#111;
  color:#fff;
  border-color:#111;
}
.pagination button:disabled {
  opacity:.45;
  cursor:not-allowed;
}
@media(max-width:700px) {
  .products-grid { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<!-- ONLY LARGE BRANDING -->
<div class="mbz-brand">
  <div class="title">MBZ TRADING</div>
  <span class="subtitle">AUTO SPARE PARTS</span>
</div>

<main class="products-page">
  <h1>Toyota Genuine Auto Spare Parts</h1>

  <div class="products-tools">
    <input id="searchInput" type="search"
           placeholder="Search part number or description...">
    <select id="categoryFilter">
      <option value="">All Categories</option>
    </select>
  </div>

  <div id="pageStatus" class="page-status"></div>

  <div id="productsGrid" class="products-grid"></div>

  <div id="pagination" class="pagination"></div>

  <div id="pageNumber" class="page-status"></div>
</main>

<script src="script.js"></script>
<script>
(function () {
  /* =========================================================
     PRODUCT PAGINATION
     EXACTLY 10 PARTS MAXIMUM ON EACH PAGE
     Page 1 = Parts 1-10
     Page 2 = Parts 11-20
     Page 3 = Parts 21-30
     ========================================================= */

  const PARTS_PER_PAGE = 10;

  let currentPage = 1;
  let allProducts = [];
  let filteredProducts = [];

  function getValue(obj, keys) {
    for (const key of keys) {
      if (obj && obj[key] !== undefined && obj[key] !== null &&
          String(obj[key]).trim() !== "") {
        return obj[key];
      }
    }
    return "";
  }

  function getProducts() {
    const possibleArrays = [
      window.products,
      window.parts,
      window.productData,
      window.toyotaParts,
      window.inventory,
      window.items
    ];

    for (const list of possibleArrays) {
      if (Array.isArray(list) && list.length > 0) return list;
    }

    // Find the existing product array automatically if its variable
    // has a different name.
    for (const key of Object.keys(window)) {
      try {
        const value = window[key];
        if (Array.isArray(value) && value.length &&
            typeof value[0] === "object") {
          const sample = JSON.stringify(value.slice(0,3));
          if (/04465|part.?number|description/i.test(sample)) {
            return value;
          }
        }
      } catch (e) {}
    }

    return [];
  }

  function normalize(item) {
    return {
      part: getValue(item, [
        "partNumber","part_number","Part Number","partNo","part",
        "PART NUMBER","PART_NUMBER"
      ]),
      description: getValue(item, [
        "description","Description","desc","DESCRIPTION","name","Name"
      ]),
      category: getValue(item, [
        "category","Category","CATEGORY"
      ]),
      model: getValue(item, [
        "model","Model","MODEL"
      ]),
      engine: getValue(item, [
        "engine","Engine","ENGINE","engineCC","Engine CC"
      ]),
      fitment: getValue(item, [
        "fitment","Fitment","FITMENT","filment","Filment"
      ])
    };
  }

  function escapeHTML(value) {
    return String(value || "").replace(/[&<>"']/g, function (char) {
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char];
    });
  }

  function populateCategories() {
    const select = document.getElementById("categoryFilter");

    const categories = [...new Set(
      allProducts
        .map(product => product.category)
        .filter(Boolean)
    )].sort();

    select.innerHTML =
      '<option value="">All Categories</option>' +
      categories.map(category =>
        '<option value="' + escapeHTML(category) + '">' +
        escapeHTML(category) +
        '</option>'
      ).join("");
  }

  function filterProducts() {
    const search = document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

    const category = document.getElementById("categoryFilter").value;

    filteredProducts = allProducts.filter(function(product) {
      const searchableText = [
        product.part,
        product.description,
        product.category,
        product.model,
        product.engine,
        product.fitment
      ].join(" ").toLowerCase();

      return (
        (!search || searchableText.includes(search)) &&
        (!category || product.category === category)
      );
    });

    currentPage = 1;
    showPage();
  }

  function showPage() {
    /*
      IMPORTANT:
      start = 0  -> Parts 1-10
      start = 10 -> Parts 11-20
      start = 20 -> Parts 21-30
    */
    const totalPages = Math.max(
      1,
      Math.ceil(filteredProducts.length / PARTS_PER_PAGE)
    );

    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * PARTS_PER_PAGE;
    const end = start + PARTS_PER_PAGE;

    // ONLY 10 products are selected for this page.
    const pageProducts = filteredProducts.slice(start, end);

    document.getElementById("pageStatus").textContent =
      "Showing Parts " +
      (filteredProducts.length ? start + 1 : 0) +
      "–" +
      Math.min(end, filteredProducts.length) +
      " of " +
      filteredProducts.length;

    const grid = document.getElementById("productsGrid");

    if (pageProducts.length === 0) {
      grid.innerHTML = "<p>No products found.</p>";
    } else {
      grid.innerHTML = pageProducts.map(function(product) {
        const message =
          "Hello MBZ TRADING, I am interested in Toyota genuine part " +
          product.part +
          ". Please provide price and availability.";

        return `
          <article class="product-card">
            <h3>${escapeHTML(product.part || "Toyota Genuine Part")}</h3>

            <div class="product-meta">
              <strong>Description:</strong>
              ${escapeHTML(product.description || "—")}
            </div>

            <div class="product-meta">
              <strong>Category:</strong>
              ${escapeHTML(product.category || "—")}
            </div>

            ${product.model ? `
              <div class="product-meta">
                <strong>Model:</strong>
                ${escapeHTML(product.model)}
              </div>` : ""}

            ${product.engine ? `
              <div class="product-meta">
                <strong>Engine:</strong>
                ${escapeHTML(product.engine)}
              </div>` : ""}

            ${product.fitment ? `
              <div class="product-meta">
                <strong>Fitment:</strong>
                ${escapeHTML(product.fitment)}
              </div>` : ""}

            <a class="whatsapp-btn"
               target="_blank"
               rel="noopener"
               href="https://wa.me/923335173910?text=${encodeURIComponent(message)}">
               Enquire on WhatsApp
            </a>
          </article>
        `;
      }).join("");
    }

    createPagination(totalPages);

    document.getElementById("pageNumber").textContent =
      "Page " + currentPage + " of " + totalPages;
  }

  function createPagination(totalPages) {
    const container = document.getElementById("pagination");
    container.innerHTML = "";

    // PREVIOUS
    const previous = document.createElement("button");
    previous.textContent = "Previous";
    previous.disabled = currentPage === 1;
    previous.onclick = function() {
      goToPage(currentPage - 1);
    };
    container.appendChild(previous);

    // PAGE NUMBERS
    for (let page = 1; page <= totalPages; page++) {
      const button = document.createElement("button");

      button.textContent = page;

      if (page === currentPage) {
        button.className = "active";
      }

      button.onclick = function() {
        goToPage(page);
      };

      container.appendChild(button);
    }

    // NEXT
    const next = document.createElement("button");
    next.textContent = "Next";
    next.disabled = currentPage === totalPages;
    next.onclick = function() {
      goToPage(currentPage + 1);
    };
    container.appendChild(next);
  }

  function goToPage(page) {
    const totalPages = Math.max(
      1,
      Math.ceil(filteredProducts.length / PARTS_PER_PAGE)
    );

    if (page < 1 || page > totalPages) return;

    currentPage = page;
    showPage();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  // LOAD THE EXISTING MBZ TRADING PRODUCT DATA
  allProducts = getProducts()
    .map(normalize)
    .filter(product => product.part || product.description);

  filteredProducts = allProducts.slice();

  populateCategories();
  showPage();

  document.getElementById("searchInput")
    .addEventListener("input", filterProducts);

  document.getElementById("categoryFilter")
    .addEventListener("change", filterProducts);

})();
</script>

</body>
</html>
